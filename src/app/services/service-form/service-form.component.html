<div class="container mt-4">
  <h2>Add Service</h2>
  <form (ngSubmit)="saveService()">
    <input [(ngModel)]="service.name" name="name" placeholder="Service Name" class="form-control mb-2" required />
    <input [(ngModel)]="service.description" name="description" placeholder="Description" class="form-control mb-2" required />
    <input [(ngModel)]="service.price" name="price" placeholder="Price" type="number" class="form-control mb-2" required />
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
</div>
