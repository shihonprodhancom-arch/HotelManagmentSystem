<div class="container mt-4">
  <h2 class="text-center mb-3">Add Extra Service</h2>
  <form (ngSubmit)="saveService()" #serviceForm="ngForm">
    <div class="form-group mb-3">
      <label>Name</label>
      <input type="text" class="form-control" [(ngModel)]="service.name" name="name" required>
    </div>

    <div class="form-group mb-3">
      <label>Description</label>
      <textarea class="form-control" [(ngModel)]="service.description" name="description" required></textarea>
    </div>

    <div class="form-group mb-3">
      <label>Price</label>
      <input type="number" class="form-control" [(ngModel)]="service.price" name="price" required>
    </div>

    <button class="btn btn-primary" type="submit">Save Service</button>
  </form>
</div>
