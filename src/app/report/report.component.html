<div class="container my-5">
  <div class="card shadow-lg border-0 rounded-4">
    <div class="card-header bg-primary text-white text-center py-4">
      <h2 class="mb-0"><i class="bi bi-journal-text me-2"></i>Reports</h2>
    </div>

    <div class="card-body text-center">
      <p class="lead mb-4">Generate and download your booking or attendance reports.</p>

      <div class="d-flex justify-content-center flex-wrap gap-4 my-4">

        <!-- Booking Reports -->
        <button 
          [ngClass]="{'btn-active': activeBookingFormat === 'pdf'}"
          class="btn btn-gradient btn-xl px-5 py-3 fw-bold shadow-sm rounded-pill"
          (click)="downloadBookingReport('pdf')">
          <i class="bi bi-file-earmark-pdf me-2"></i> Booking PDF
        </button>

        <button 
          [ngClass]="{'btn-active': activeBookingFormat === 'xlsx'}"
          class="btn btn-gradient btn-xl px-5 py-3 fw-bold shadow-sm rounded-pill"
          (click)="downloadBookingReport('xlsx')">
          <i class="bi bi-file-earmark-spreadsheet me-2"></i> Booking Excel
        </button>

        <!-- Attendance Reports -->
        <button 
          [ngClass]="{'btn-active': activeAttendanceFormat === 'pdf'}"
          class="btn btn-gradient btn-xl px-5 py-3 fw-bold shadow-sm rounded-pill"
          (click)="downloadAttendanceReport('pdf')">
          <i class="bi bi-file-earmark-pdf me-2"></i> Attendance PDF
        </button>

        <button 
          [ngClass]="{'btn-active': activeAttendanceFormat === 'xlsx'}"
          class="btn btn-gradient btn-xl px-5 py-3 fw-bold shadow-sm rounded-pill"
          (click)="downloadAttendanceReport('xlsx')">
          <i class="bi bi-file-earmark-spreadsheet me-2"></i> Attendance Excel
        </button>

      </div>

      <!-- Loading spinner -->
      <div *ngIf="loading" class="mt-3">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2 fw-bold text-primary">Downloading report...</p>
      </div>

      <!-- Error message -->
      <div *ngIf="errorMessage" class="mt-3 alert alert-danger fw-bold">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ errorMessage }}
      </div>
    </div>
  </div>
</div>
